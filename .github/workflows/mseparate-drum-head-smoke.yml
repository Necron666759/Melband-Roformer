name: mseparate real Snare and Toms output smoke

on:
  push:
    branches:
      - feature/mseparate-snare-toms-model-routing
    paths:
      - "app/mseparate/**"
      - "scripts/smoke_mseparate_real_models.py"
      - ".github/workflows/mseparate-drum-head-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mseparate-drum-head-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-drum-head-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch matching the application runtime
        run: python -m pip install torch==2.13.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned MSST runtime and audio dependencies
        run: python -m pip install "pymss==2.3.5" numpy soundfile tqdm soxr
      - name: Verify pinned 53-stem assets and request Snare/Toms outputs
        env:
          PYTHONPATH: app
        run: >-
          python scripts/smoke_mseparate_real_models.py
          --device cpu
          --models zfturbo-bs-roformer-53stem-candidate
