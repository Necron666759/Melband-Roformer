name: mseparate foundation tests

on:
  push:
    branches:
      - feature/mseparate-foundation
      - feature/mseparate-6stem-gpu
      - feature/mseparate-gpu-foundation-sync
      - feature/mseparate-cpu-real-audio-evaluation
      - feature/mseparate-style-routing-followup
      - feature/mseparate-electronic-genre-coverage
      - feature/mseparate-electronic-source-taxonomy
      - feature/mseparate-drum-source-routing
      - feature/mseparate-snare-toms-model-routing
      - feature/mseparate-snare-toms-quality-evaluation
  pull_request:
    branches:
      - main
      - feature/mseparate-cpu-real-audio-evaluation
      - feature/mseparate-electronic-genre-coverage
      - feature/mseparate-electronic-source-taxonomy
      - feature/mseparate-drum-source-routing
      - feature/mseparate-drum-component-taxonomy
      - feature/mseparate-snare-toms-model-routing
      - feature/mseparate-snare-toms-quality-evaluation
      - feature/mseparate-gpu-foundation-sync

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only test dependencies
        run: python -m pip install --upgrade pytest numpy soundfile tqdm soxr
      - name: Build wrapper wheel and validate packaging metadata
        run: |
          python -m pip install --upgrade "setuptools>=77.0.0" wheel build
          python -m build --wheel --no-isolation app
      - name: Compile AppImage and evaluation entry-point Python scripts
        run: python -m py_compile appimage/melband-roformer-shell.py appimage/melband-roformer-hud-term.py scripts/evaluate_mseparate_drum_heads.py scripts/download_mseparate_babyslakh_subset.py scripts/evaluate_mseparate_babyslakh.py scripts/inspect_mseparate_stemgmd_archive.py scripts/download_mseparate_stemgmd_subset.py
      - name: Run AppImage restricted-shell regression tests
        env:
          PYTHONPATH: app
        run: python -m pytest -q tests/test_appimage_shell.py
      - name: Run project tests without model downloads or GPU
        env:
          PYTHONPATH: app
        run: python -m pytest -q tests/test_mseparate.py tests/test_mseparate_electronic.py tests/test_mseparate_assets.py tests/test_mseparate_execution.py tests/test_mseparate_melband.py tests/test_mseparate_quality.py tests/test_mseparate_demucs_onnx.py tests/test_mseparate_pymss.py tests/test_mseparate_license_policy.py tests/test_mseparate_vram.py tests/test_mseparate_quarantine.py tests/test_mseparate_demucs_cli.py tests/test_mseparate_candidate_analysis.py tests/test_mseparate_conditional_rescue.py tests/test_mseparate_vocal_comparison.py tests/test_mseparate_evaluation.py tests/test_mseparate_babyslakh_subset.py tests/test_mseparate_babyslakh_evaluation.py tests/test_mseparate_stemgmd_subset.py
