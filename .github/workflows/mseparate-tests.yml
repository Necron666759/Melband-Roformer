name: mseparate foundation tests

on:
  push:
    branches:
      - feature/mseparate-foundation
  pull_request:
    branches:
      - main

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only test dependencies
        run: python -m pip install --upgrade pytest numpy soundfile tqdm
      - name: Run project tests without model downloads or GPU
        env:
          PYTHONPATH: app
        run: python -m pytest -q tests
