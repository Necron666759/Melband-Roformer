name: mseparate real Mega 53 specialist smoke tests

on:
  push:
    branches:
      - feature/mseparate-gpu-foundation-sync
    paths:
      - "app/mseparate/**"
      - "scripts/smoke_mseparate_real_models.py"
      - ".github/workflows/mseparate-real-model-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mseparate-real-model-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch matching the application runtime
        run: python -m pip install torch==2.13.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned MSST runtime and audio dependencies
        run: python -m pip install "pymss==2.3.5" numpy soundfile tqdm soxr
      - name: Verify pinned hashes, strict-load and infer Mega 53 specialists
        env:
          PYTHONPATH: app
        run: python scripts/smoke_mseparate_real_models.py --device cpu --models mvsep-mega53-bass-specialist-candidate mvsep-mega53-kick-specialist-candidate mvsep-mega53-drums-specialist-candidate mvsep-mega53-organ-specialist-candidate mvsep-mega53-digital-piano-specialist-candidate mvsep-mega53-percussion-specialist-candidate mvsep-mega53-hh-specialist-candidate zfturbo-bs-roformer-53stem-candidate
