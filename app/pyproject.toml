[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melband-roformer-wrapper"
version = "0.1.0"
description = "Debian-packaging CLI/GUI wrapper around upstream melband-roformer-infer"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "melband-roformer-infer==0.1.5",
    "soundfile>=0.12,<0.13",
    "tqdm>=4.64",
]

[project.scripts]
melband-roformer = "melband_roformer_wrapper.cli:main"
melband-roformer-gui = "melband_roformer_wrapper.gui:main"
mseparate = "mseparate.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
mseparate = ["data/*.json"]

[tool.setuptools]
py-modules = ["sitecustomize"]
